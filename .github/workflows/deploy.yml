name: build, verify, deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  NODE_VERSION: '22'

jobs:
  build:
    name: build and QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: install the browser qa:console needs
        run: npx playwright install --with-deps chromium

      # The analytics config is absent from the repo by design. When these
      # secrets are set the Firebase module is emitted; when they are not, the
      # site builds and deploys without it.
      - name: build
        env:
          PUBLIC_FIREBASE_API_KEY: ${{ secrets.PUBLIC_FIREBASE_API_KEY }}
          PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.PUBLIC_FIREBASE_AUTH_DOMAIN }}
          PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.PUBLIC_FIREBASE_PROJECT_ID }}
          PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.PUBLIC_FIREBASE_STORAGE_BUCKET }}
          PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          PUBLIC_FIREBASE_APP_ID: ${{ secrets.PUBLIC_FIREBASE_APP_ID }}
          PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.PUBLIC_FIREBASE_MEASUREMENT_ID }}
        run: npm run build

      # ONE step, running the same list `npm run qa` runs.
      #
      # It used to be a hand-copied list of individual steps, and the two lists drifted:
      # `qa:worlds` and `qa:plate` lived in `npm run qa` and were never in CI at all, so
      # two gates the repo believed it was enforcing had never once run on a pull request.
      # A duplicated list of gates is a list that will be wrong.
      - name: qa (every gate)
        run: npm run qa

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  lighthouse:
    name: lighthouse ci
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # LHCI's own static server is used deliberately: it installs the
      # `compression` middleware unconditionally, so every resource-summary
      # assertion measures gzip transfer bytes, which is what the brief's
      # budget lines are stated in. `npx serve` does not gzip.
      - name: lighthouse ci
        run: npx --no-install lhci autorun --config=lighthouserc.json

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouseci
          retention-days: 3

  deploy:
    name: deploy to github pages
    needs: [build, lighthouse]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
