<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <!-- Apple-style: off-white #FBFBFD ground, near-black #1D1D1F headline, grey #6E6E73
       subhead, orange (#FF5E1A → #FFA53A) only as a soft glow and on "Dogs".
       Fonts: Inter Tight (headline) and Inter (subhead) from Google Fonts.
       Content stays in YouTube's 1546×423 centre safe area. -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter+Tight:wght@600&amp;family=Inter:wght@400&amp;display=block');
    .h { font-family: 'Inter Tight', sans-serif; font-weight: 600; font-size: 168px; letter-spacing: -4px; }
    .s { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 50px; letter-spacing: -0.5px; }
  </style>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF8A2A" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#FFB347" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFB347" stop-opacity="0"/>
    </radialGradient>
    <!-- Spans the whole headline's box; "Dogs" occupies roughly the right 37%. -->
    <linearGradient id="dogs" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.6" stop-color="#FF5E1A"/>
      <stop offset="1" stop-color="#FFA53A"/>
    </linearGradient>
  </defs>

  <rect width="2560" height="1440" fill="#FBFBFD"/>
  <ellipse cx="1280" cy="720" rx="1100" ry="560" fill="url(#glow)"/>

  <g transform="translate(1228 518) scale(2.6)">
    <path d="M7 12 2 1 14 6Z" fill="#FF6B1A"/>
    <path d="M33 12 38 1 26 6Z" fill="#FF6B1A"/>
    <path d="M6 13Q6 5 14 5H26Q34 5 34 13V23Q34 33 20 33Q6 33 6 23Z" fill="none" stroke="#1D1D1F" stroke-width="2.4"/>
    <rect x="14" y="21" width="12" height="7" rx="3.5" fill="#1D1D1F"/>
  </g>

  <text class="h" x="1280" y="792" text-anchor="middle" fill="#1D1D1F">TheGeek<tspan fill="url(#dogs)">Dogs</tspan></text>
  <text class="s" x="1280" y="878" text-anchor="middle" fill="#6E6E73">Engineering. Geeks with paws.</text>
</svg>
